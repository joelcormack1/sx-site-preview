<script>
/* creatives was built as a 100vh live-site port with no footer — size the
   page to the real roster end so the footer law pins BELOW the content
   (8/21: it was landing mid-roster). */
document.addEventListener('DOMContentLoaded', () => {
  const pg = document.getElementById('page');
  const rows = document.getElementById('rows');
  if (!pg || !rows) return;
  const need = rows.getBoundingClientRect().bottom - pg.getBoundingClientRect().top + 300 + 349;
  pg.style.height = Math.max(window.innerHeight, Math.ceil(need)) + 'px';
});
</script>
<title>SIXTWENTYSIX — Creatives</title>
<!--
  CREATIVES — rebuilt 2026-08-19 as a 1:1 port of the LIVE sixtwentysix.co
  /creatives page (Joel: "identical to the creatives page on our current
  website"). Full-viewport light section; left column "Our/Creatives" (71px,
  regular/bold) with a Capabilities block that appears on hover carrying the
  hovered creative's roles; right side two columns (8+7) of bordered rows —
  33px Medium names, arrows that rotate 90deg on hover; hovering fades that
  creative's REEL in full-bleed behind everything (500ms, scale 1.01) and the
  page ink flips white. Poster stills paint instantly while video buffers.
  Reels hotlink the live site's signed Vimeo renditions (they expire
  eventually — re-pull from sixtwentysix.co/creatives or wire the WP feed).
  No footer here, same as live. No numbers, no ghost-dim: not in the live page.
-->
<script src="logomorph.js?v=20260824a"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; overscroll-behavior: none; }
  body { overflow-x: clip; /* auto broke position:sticky in Safari */ font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }

  .page {
    position: relative; width: 1728px; height: 100vh; min-height: 820px;
    margin: 0 auto; background: #fff;
    --ink: #000; --rule: rgba(0, 0, 0, 0.2);
    color: var(--ink);
  }
  .page.hov { --ink: #fff; --rule: rgba(255, 255, 255, 0.35); }

  /* full-bleed reels: live spec — 500ms opacity, scale 1.01 */
  /* Joel 8/22: pinned to the SCREEN, not the page — the old inset:0 box
     spanned the full 1511px page, so 16:9 reels were cover-cropped ~36%.
     Viewport-fixed the box is exact 16:9 at canvas width: zero crop. */
  #reels { position: fixed; top: 0; left: 50%; margin-left: -864px; width: 1728px; height: 100vh; overflow: hidden; background: #fff; }
  #reels .slot { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; transform: scale(1.01); }
  #reels .slot.on { opacity: 1; }
  #reels img, #reels video { position: absolute; left: -2px; top: -2px; width: calc(100% + 4px); height: calc(100% + 4px); object-fit: cover; /* 9/4: 2px overscan — fractional-pixel scaling let a white sliver peek at full-bleed edges (Joel) */ }

  .hdr { position: fixed; top: 0; left: 50%; margin-left: -864px; width: 1728px; height: 118px; z-index: 50; } /* fixed = compositor-pinned, zero bob (8/21) */
  .hdr-menu { position: absolute; left: 1636px; top: 44px; width: 57px; height: 30px; cursor: pointer; }
  .hdr-menu .l { position: absolute; left: 12px; width: 33px; height: 2px; background: var(--ink); border-radius: 2px; transition: background 0.4s ease; }
  .nav-sm { position: absolute; font-size: 16px; line-height: 25px; letter-spacing: 0.48px; color: var(--ink); white-space: nowrap; font-weight: 400; transition: color 0.4s ease; }
  #lettermark { position: absolute; transition: filter 0.4s ease; }
  .page.hov .hdr #lettermark { filter: invert(1); }

  .cre-head {
    /* Joel 8/22: same size as every other page header (40px bold) and on
       the SX rail (left 63) so the two are directly in line. */
    position: absolute; left: 63px; top: 150px; width: 560px;
    font-size: 40px; line-height: 48px; letter-spacing: -1.6px;
    color: var(--ink); text-transform: capitalize; transition: color 0.4s ease;
  }
  .cre-head .thin { font-weight: 400; }
  .cre-head .bold { font-weight: 700; }
  /* Joel 8/22: the info block ANIMATES in — house entrance (rise + fade),
     Capabilities first, the roles a beat behind. Exit is a quick clean fade. */
  #caps { position: absolute; left: 63px; top: 330px; width: 430px; color: var(--ink); pointer-events: none; }
  #caps .cap-t, #caps .cap-r {
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .page.hov #caps .cap-t, .page.hov #caps .cap-r {
    opacity: 1; transform: none;
    transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .page.hov #caps .cap-r { transition-delay: 0.09s; }
  #caps .cap-t { font-weight: 700; font-size: 17px; line-height: 21px; }
  #caps .cap-r {
    font-size: 12px; line-height: 1.7; letter-spacing: 0.03em; text-transform: uppercase;
    border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 16px; min-height: 50px;
    transition: border-color 0.4s ease;
  }

  #rows { position: absolute; left: 660px; top: 118px; width: 1028px; display: flex; }
  #rows .col { flex: 1; }
  .cre-row {
    display: flex; align-items: flex-end; gap: 12px;
    padding: 40px 27px 19px 0; border-bottom: 1px solid var(--rule);
    cursor: pointer; transition: border-color 0.4s ease;
  }
  .cre-row .nm {
    flex: 1; font-weight: 500; font-size: 33px; line-height: 1;
    letter-spacing: -0.99px; color: var(--ink); white-space: nowrap;
    transition: color 0.4s ease;
  }
  .cre-row .ar { flex-shrink: 0; align-self: center; display: block; transition: transform 0.3s ease; color: var(--ink); }
  .cre-row:hover .ar { transform: rotate(90deg); }
  .cre-row .ar svg { display: block; stroke: currentColor; fill: none; }
  /* Joel 8/22: hovering one name fades all the OTHER names out — only the
     hovered director stays full strength. Text and arrow dim; the rule
     lines hold the grid. */
  #rows:hover .cre-row .nm, #rows:hover .cre-row .ar { opacity: 0.15; }
  #rows:hover .cre-row:hover .nm, #rows:hover .cre-row:hover .ar { opacity: 1; }
  .cre-row .nm { transition: color 0.4s ease, opacity 0.35s ease; }
  .cre-row .ar { transition: transform 0.3s ease, color 0.4s ease, opacity 0.35s ease; }

  /* ---------- Footer (black, SIX26) — THE FOOTER LAW: on every page ---------- */
  @font-face {
    font-family: 'Azeret Mono';
    src: url('fonts/AzeretMono-VF.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  .footer {
    position: absolute; left: 0; width: 1728px; height: 349px;
    background: #000; overflow: hidden; z-index: 6;
  }
  .foot-cta {
    position: absolute; left: 40px; top: 60px; width: 470px; height: 74px;
    font-weight: 700; font-size: 24px; line-height: 24px;
    color: #fff; text-transform: uppercase; word-break: break-word;
  }
  .foot-cta a { text-decoration: underline; text-underline-position: from-font; cursor: pointer; color: inherit; }
  .foot-mark { position: absolute; top: 54.44%; right: 2.23%; bottom: -35.46%; left: 2.29%; }
  .foot-mark img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
  .foot-col {
    position: absolute;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* 9/4 Joel: footers all in Helvetica (was Azeret Mono) */
    font-weight: 400; font-size: 15px; line-height: 17.5px;
    color: #fff; text-transform: uppercase; word-break: break-word;
  }
  .foot-col .b, .foot-b { font-weight: 700; }
</style>

    { slug:'sharon-chetrit', name:"Sharon Chetrit", roles:"DIRECTOR", video:"https://player.vimeo.com/progressive_redirect/playback/1219031832/rendition/1080p/file.mp4%20%281080p%29.mp4?loc=external&log_user=0&signature=618f37636e50b8a215339bed1866944d4b2112408e5ad9790a1eaf17334fcfdd", poster:"https://api.sixtwentysix.co/wp-content/uploads/2026/07/Sharon-still0.jpg" },
    { slug:'tom-morris', name:"Tom Morris", roles:"DIRECTOR, CREATIVE DIRECTOR, PHOTOGRAPHER, EDITOR", video:"https://player.vimeo.com/progressive_redirect/playback/1128949273/rendition/1080p/file.mp4?loc=external&log_user=0&signature=3c020de8d881a8e9f0a239872434389dc6337ab1e91e9a0f3eee8e4a664d1838", poster:"https://api.sixtwentysix.co/wp-content/uploads/2025/05/TOM-MORRIS_REEL_YS_v2_2025-10-14.00_00_00_00.Still003.png" }
  ];
  const SPLIT = 8; /* live DOM: 8 rows in the left column, 7 in the right */

  const reels = document.getElementById('reels');
  const colA = document.getElementById('colA');
  const colB = document.getElementById('colB');
  const capRoles = document.getElementById('capRoles');
  const page = document.getElementById('page');

  const slots = ROSTER.map(d => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = '<img src="' + d.poster + '" alt="" loading="lazy">' +
      '<video muted loop playsinline preload="none" src="' + d.video + '"></video>';
    reels.appendChild(slot);
    return slot;
  });

  let leaveTimer = null;
  const clear = () => {
    page.classList.remove('hov');
    slots.forEach(sl => {
      sl.classList.remove('on');
      const v = sl.querySelector('video');
      if (v && !v.paused) v.pause();
    });
  };

  ROSTER.forEach((d, i) => {
    const row = document.createElement('a');
    row.className = 'cre-row';
    row.href = 'director.html?who=' + encodeURIComponent(d.slug); /* 9/3: each creative opens THEIR page */
    row.innerHTML = '<span class="nm">' + d.name.replace('&', '&amp;') + '</span>' +
      '<span class="ar"><svg width="17" height="14" viewBox="0 0 17 14" xmlns="http://www.w3.org/2000/svg"><path d="M9.16666 12.4136L15.0333 6.91357L9.16666 1.41358" stroke-width="2" stroke-linecap="square"/><path d="M15.0333 6.91357L0 6.91363" stroke-width="2"/></svg></span>';
    (i < SPLIT ? colA : colB).appendChild(row);

    row.addEventListener('mouseenter', () => {
      clearTimeout(leaveTimer);
      page.classList.add('hov');
      slots.forEach((sl, k) => sl.classList.toggle('on', k === i));
      const v = slots[i].querySelector('video');
      if (v) v.play().catch(() => {});
      capRoles.textContent = d.roles;
    });
    row.addEventListener('mouseleave', () => {
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(clear, 90);
    });
  });
})();
</script>
