<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SIXTWENTYSIX</title>
<!--
  MOBILE v2 (2026-09-04). Joel's law: "use the logic of the current website
  I built and apply mobile sizing from the Figma Full Site Mobile frames."
  Every desktop law translated, not simplified:
  - THE MORPH: SIX26 -> SX in the header on scroll — I/2/6 fade, the X
    glides into the S, the (R) returns after lock. NO scale change (Joel
    9/4). Reverse plays going back up; menu open = SIX26 at the same size.
  - THE REEL MOMENT (Joel 9/8): on home the header's white dissolves as
    the morph lands so the sizzle reel runs full-bleed under white marks,
    then the statement sheet's edge wipes the white back in (desktop law).
  - THE LOOP LAW: every work tile plays its own loop — on mobile the tile
    in view plays (one at a time, muted).
  - THE FOOTER LAW: black flush to the very bottom, black overscroll.
  - Density toggle: rows of 2 / rows of 1 (desktop's 4/3/2/1 cluster,
    mobile sizes), persisted.
  - Tabs are text + underline (site language), never bordered chips.
  - Director flow per the live site: loop + name -> scroll darkens the
    film (0.79, the desktop pv scrim) -> about/awards over it -> work.
  - Statements verbatim with the desktop bold splits. Spelling laws hold.
  - Generated from m-src.html by inject-m.py (logos inline; loops/copy/
    ledgers lifted from the desktop pages so nothing drifts).
  2026-09-08 sync to Joel's Figma edits (Full Site Mobile, 305:3889):
  - Type scale down: statements 20/23, body 12/17, tabs 12, tile caps 14,
    section labels 24/28, page titles 32/36. Cities show on every page.
  - Services stepper "slides as you scroll from 1 2 3" (Joel's canvas
    note): sticky 01 Creative / 02 Production / 03 Post / 04 Experiential
    row, the words glide left as each pillar's items scroll under it.
  - Director: name + Back at the top-left over the film, SCROLL TO VIEW
    MORE WORK cue, scroll darkens to 0.75 with role / awards / about.
  - About: statement above the reel (reel 475 tall); Contact + Careers
    restyled to the frames; Home density toggle = Joel's icon (2x2 / 1).
  - Case Studies: desktop ledger + Creative Studio / Live Action /
    Experiential tabs (4 / 11 / 8), not the raw CMS list.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* FOOTER LAW: bottom overscroll is black, top stays white */
  /* iOS overscroll: the old 50/50 gradient REPEATS below the document and
     its next tile starts white (Joel 9/8, "white under the footer every
     time"). Now: black canvas, one non-repeating white sheet that runs from
     far above the page down to 100px above its end — white when you pull
     at the top, black when you pull past the footer. */
  /* Safari tints its toolbar from the canvas colour, so the canvas stays
     WHITE (a black canvas turned the whole bottom bar black, Joel 9/8).
     The black under the footer comes from a fixed strip parked just below
     the viewport (visible only when you pull past the end), and the root
     refuses to rubber-band at all where iOS supports it. */
  html { background: #fff; overscroll-behavior-y: none; }
  body::after { content: ''; position: fixed; left: 0; right: 0; bottom: -400px; height: 400px; background: #000; z-index: -1; pointer-events: none; }
  body { background: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000; overscroll-behavior-y: none; }
  a { color: inherit; text-decoration: none; }
  img, video { display: block; max-width: 100%; }
  .wrap { padding: 0 20px; }

  /* ================= header + THE MORPH ================= */
  /* THE REEL MOMENT (Joel 9/8, "same as the main site"): the header's white
     is its own layer. On home it dissolves as the morph lands so the sizzle
     reel runs full-bleed under white marks, then the statement sheet's
     leading edge WIPES the white back in as it slides under the header
     (desktop updateReelMoment). Interior pages: solid white. */
  #hdr { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: transparent; z-index: 40; }
  #hdrBg { position: absolute; inset: 0; background: #fff; }
  #hdr .in { height: 100%; position: relative; padding: 0 20px; z-index: 1; }
  #hdr.snap, #hdr.snap * { transition: none !important; }
  #lm { position: absolute; left: 20px; top: 17px; width: 160px; height: 26px; display: block; }
  /* > child only: the (R) is two NESTED spans (ring + R) with their own
     inline geometry — the old descendant rule forced them to 26px tall and
     stacked the R above the ring (Joel's 9/8 screenshot) */
  #lm > span { position: absolute; top: 0; height: 26px; display: block; }
  #lm > span > svg { height: 100%; width: auto; }
  #lm svg { display: block; }   /* every piece incl. the (R)'s ring + R: inline svgs sit on a baseline and sink */
  #lm svg path { fill: #000; transition: fill 0.35s ease; }
  /* dark chrome (director hero, the home reel moment): no white, marks in white */
  #hdr.dark #hdrBg { opacity: 0; }
  #hdr.dark #lm svg path { fill: #fff; }
  /* cities ride beside the mark on EVERY page (Figma header component):
     left is driven by the morph (beside SIX26 at q=0, beside SX at q=1) */
  #hdrCities { position: absolute; left: 186px; top: 18px; font-size: 8.5px; line-height: 12px; letter-spacing: 0.26px; text-transform: uppercase; transition: color 0.35s ease; }
  #hdr.dark #hdrCities { color: #fff; }
  #burger { position: absolute; right: 20px; top: 21px; width: 33px; height: 18px; background: none; border: 0; cursor: pointer; z-index: 2; }
  #burger i { position: absolute; left: 0; width: 33px; height: 2px; background: #000; border-radius: 2px; transition: transform 0.4s cubic-bezier(0.65,0,0.35,1), opacity 0.2s ease, background 0.35s ease; }
  #burger i:nth-child(1) { top: 0; } #burger i:nth-child(2) { top: 8px; } #burger i:nth-child(3) { top: 16px; }
  #hdr.dark #burger i { background: #fff; }
  body.menu-open #burger i:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open #burger i:nth-child(2) { opacity: 0; }
  body.menu-open #burger i:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  body.menu-open #hdr #hdrBg { opacity: 1 !important; }
  body.menu-open #hdr #burger i { background: #000; }
  body.menu-open #hdr #lm svg path { fill: #000; }

  /* ================= menu (Figma 551:87) ================= */
  #menu { position: fixed; inset: 0; background: #fff; z-index: 30; padding: 92px 20px 24px;
          transform: translateY(-102%); transition: transform 0.55s cubic-bezier(0.33,1,0.68,1);
          display: flex; flex-direction: column; overflow-y: auto; }
  body.menu-open #menu { transform: none; }
  #mSearch { width: 100%; border: 0; outline: 0; font: 400 18px/1.2 'Helvetica Neue', Helvetica, sans-serif; letter-spacing: -0.5px; padding: 0 0 14px; background: transparent; }
  #mSearch::placeholder { color: #a4a4a4; }
  .m-rule { border-top: 1px solid #a4a4a4; margin-bottom: 34px; }
  .m-label { font-size: 14px; margin-bottom: 10px; }
  .m-link { display: block; font-weight: 700; font-size: 30px; line-height: 48px; letter-spacing: -0.9px; transition: opacity 0.25s ease; }
  .m-link.dim { opacity: 0.18; }
  #mResults a { display: block; padding: 8px 0; font-weight: 500; font-size: 17px; }
  #mResults .k { color: #a4a4a4; font-size: 11px; text-transform: uppercase; margin-left: 8px; }
  #mFoot { margin-top: auto; padding-top: 40px; font-size: 13px; line-height: 20px; }

  /* ================= shared ================= */
  #app { padding-top: 60px; min-height: 100vh; background: #fff; }
  /* Figma 9/8 type scale: title 32/36, label 24/28, statement 20/23, body 12/17 */
  .pg-title { font-weight: 700; font-size: 32px; line-height: 36px; letter-spacing: -1.28px; padding: 44px 0 0; }
  .sec-row { display: flex; align-items: flex-start; justify-content: space-between; margin: 86px 0 28px; }
  .sec-label { font-weight: 700; font-size: 24px; line-height: 28px; letter-spacing: -0.72px; }
  .statement { font-size: 20px; line-height: 23px; letter-spacing: -0.7px; font-weight: 400; }
  .statement b { font-weight: 700; }
  .statement .md, .statement.md { font-weight: 500; }
  .statement .gray { color: #bdbdbd; }
  .fdm { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
  .fdm.seen { opacity: 1; transform: none; }

  /* density toggle — the site's cluster at mobile size (2-up / 1-up) */
  /* Joel's icon (Figma 605:1299): 2x2 squares = two per row, one block = one per row */
  /* exact Figma geometry (605:1270-1297): 2x2 = 10.7 + 1.4 + 11.4 wide, 8.6 + 2.1 + 9.3 tall; 10.8 to the 24.3x20 block */
  .gtog { display: flex; gap: 10.8px; align-items: flex-start; padding-top: 4px; }
  .gtog button { background: none; border: 0; padding: 0; cursor: pointer; opacity: 0.13; transition: opacity 0.25s ease; display: block; line-height: 0; }
  .gtog button.on { opacity: 1; }
  .gtog i { display: block; background: #686767; }
  .gtog .q { display: grid; grid-template-columns: 10.7px 11.4px; grid-template-rows: 8.6px 9.3px; gap: 2.1px 1.4px; }
  .gtog .q i { width: 100%; height: 100%; }
  .gtog .one i { width: 24.3px; height: 20px; }

  /* tiles — hard corners, caption under (brand + director), THE LOOP LAW */
  .grid { display: grid; gap: 22px 12px; grid-template-columns: 1fr; }
  .grid.g2 { grid-template-columns: 1fr 1fr; }
  .tile { display: block; }
  .tile .ph { width: 100%; aspect-ratio: 16/9; background: #d9d9d9; overflow: hidden; position: relative; }
  .tile .ph img, .tile .ph video { position: absolute; left: -1px; top: -1px; width: calc(100% + 2px); height: calc(100% + 2px); object-fit: cover; }
  .tile .ph video { opacity: 0; transition: opacity 0.45s ease; }
  .tile.playing .ph video { opacity: 1; }
  .tile .t { font-weight: 700; font-size: 14px; line-height: 17px; letter-spacing: -0.28px; margin-top: 10px; text-transform: uppercase; }
  .tile .d { font-size: 10px; line-height: 10px; color: #6b6b6b; margin-top: 1px; }
  .grid.g2 .tile .t { font-size: 12px; margin-top: 7px; }
  .grid.g2 .tile .d { font-size: 9px; }

  /* tabs — site language: text + 1px underline the width of the word (Figma 551:951-954) */
  .tabs { display: flex; gap: 44px; margin: 28px 0 40px; flex-wrap: wrap; }
  .tabs button { background: none; border: 0; padding: 0 0 3px; font: 400 12px/17px 'Helvetica Neue', Helvetica, sans-serif; letter-spacing: -0.26px; color: #bdbdbd; border-bottom: 1px solid transparent; cursor: pointer; transition: color 0.25s ease, border-color 0.25s ease; }
  .tabs button.on { color: #000; border-color: #000; }

  /* PAGED RAILS (Figma 553:1456 / 553:1391 / 557:274 + the progress
     vectors 553:1457-58): one card per page, swipe, a 303px hairline
     track with a black thumb that walks with the page. */
  .press-rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 20px 8px; scroll-padding-left: 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .press-rail[data-rail="prBar"] { scroll-padding-left: 35px; }
  .press-rail[data-rail="xBar"] { scroll-padding-left: 31px; }
  .press-rail[data-rail="tBar"] { scroll-padding-left: 30px; }
  .press-rail::-webkit-scrollbar { display: none; }
  .pbar { position: relative; height: 1px; width: 303px; background: #bbbbbb; }
  .pbar i { position: absolute; left: 0; top: 0; height: 1px; background: #000; width: 55px; transition: transform 0.35s cubic-bezier(0.33,1,0.68,1); }
  /* NEWS AND FEATURES = the desktop rail (index.html): the cards ROLL
     continuously (24px/s, periodic copies), a tap lights a card (the logo
     lifts, the article image burns in over ~1s, the others ghost to 15%,
     the roll pauses), a second tap or READ opens the article, a swipe
     drags the rail, the chevrons nudge one card. Frame geometry (553:1418):
     logo / 54 / 16px quote / 53 / READ; 150px of headroom for the lift. */
  /* touch-action pan-y: vertical pans stay the page's, horizontal ones are OURS
     (without it iOS claims a slightly diagonal swipe as a scroll and cancels the drag) */
  .news-rail { position: relative; overflow: hidden; padding-top: 150px; touch-action: pan-y; }
  .news-track { display: flex; gap: 61px; padding-left: 35px; will-change: transform; align-items: flex-start; }
  .press { flex: 0 0 305px; position: relative; cursor: pointer; transition: opacity 0.5s ease; }
  .news-track.lit .press:not(.lit) { opacity: 0.15; }
  .press-logo { position: relative; z-index: 2; line-height: 0; transition: transform 0.5s cubic-bezier(0.32,0.72,0,1); }
  .press.lit .press-logo { transform: translateY(var(--logo-up, 0px)); }
  .press-wipe { position: absolute; left: 0; width: 274px; height: 154px; overflow: hidden; opacity: 0; transition: opacity 0.6s ease; }
  .press-wipe img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .press.lit .press-wipe { opacity: 1; transition: opacity 1s ease 0.15s; }
  .press img.lg { width: auto; display: inline-block; }
  .press .q { font-weight: 400; font-size: 16px; line-height: 22px; letter-spacing: -0.32px; margin: 54px 0 53px; }
  .press .read { display: inline-block; font-size: 14px; line-height: 33px; font-weight: 500; }
  .pr-chev { background: none; border: 0; font-size: 28px; line-height: 1; padding: 0 2px; cursor: pointer; color: #000; }

  /* ================= footer — flush black, no white below ================= */
  /* Figma footer component 551:38: cta 23/25, labels 9px, links 12/16, mark 350 wide */
  .footer { background: #000; color: #fff; margin-top: 56px; padding: 24px 35px 0; }
  .footer .cta { font-weight: 700; font-size: 23px; line-height: 25px; letter-spacing: 0; }
  .footer .cta a { text-decoration: none; }
  .footer .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 18px; margin: 44px 0 0; font-size: 12px; line-height: 16px; }
  .footer .cols .b { font-weight: 700; font-size: 9px; line-height: 9px; letter-spacing: 0.45px; color: #6b6b6b; text-transform: uppercase; margin-bottom: 7px; }
  .footer .mark { line-height: 0; margin: 28px -15px 0; padding-bottom: 18px; }
  .footer .mark svg { width: 100%; height: auto; display: block; }
  .footer .mark svg path { fill: #fff; }

  /* home */
  /* FIRST-SCREEN LAW (desktop + Joel 9/4): header + full-screen sizzle
     reel only; all content starts below the fold. dvh tracks the phone's
     collapsing URL bar; vh is the fallback. */
  .heroReel { width: 100%; height: calc(100vh - 60px); height: calc(100dvh - 60px); object-fit: cover; background: #000; }
  /* THE REEL MOMENT, staged (Joel 9/8): the reel is PINNED for the first
     HOME_HOLD px of scroll. It opens zoomed 40% in; the first scroll runs
     the morph, dissolves the white and zooms the reel out to 1.0, then it
     breathes (nothing moves) until the sheet slides up over it. */
  .home-stage { position: relative; height: calc(100vh + 460px); height: calc(100lvh + 460px); margin-top: -60px; background: #000; }
  .home-pin { position: sticky; top: 0; height: 100vh; height: 100lvh; overflow: hidden; background: #000; }
  .home-reel { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; transform: scale(1.4); transform-origin: 50% 50%; will-change: transform; }
  .home-body { position: relative; z-index: 2; background: #fff; }

  /* director — the live-site flow */
  /* svh = the SMALL viewport (Safari's toolbar showing), so the cue at the
     bottom is never hidden behind the browser bar (Joel 9/8: "the scroll
     arrow isnt visible on director page") */
  /* dvh = the viewport as it IS right now (Safari's bar open or collapsed):
     svh left a black band under the film once the bar collapsed (Joel 9/8,
     "there shouldnt be a black line there"), vh hid the cue behind the bar */
  /* lvh = the LARGE viewport (bar collapsed): the film always reaches the
     bottom, whichever state Safari's bar is in when you arrive (dvh lagged
     the bar on in-app navigation and left a black line, Joel 9/8). The cue
     rides above the bar by the difference between the two viewports. */
  .dir-stage { position: relative; height: 210vh; height: 210lvh; background: #000; margin-top: -60px; }
  .dir-hero { position: sticky; top: 0; height: 100vh; height: 100lvh; overflow: hidden; }
  .dir-hero video, .dir-hero img.pst { position: absolute; left: -2px; top: -2px; width: calc(100% + 4px); height: calc(100% + 4px); object-fit: cover; }
  .dir-scrim { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* Figma 605:1207 / 605:1102: name + Back top-left, cue at the bottom,
     scroll darkens to 0.75 and brings role / awards / about in over the film */
  .dir-id { position: absolute; left: 30px; top: 93px; color: #fff; }
  .dir-id .nm { font-weight: 700; font-size: 18px; line-height: 19px; letter-spacing: -0.48px; text-transform: uppercase; }
  .dir-id .bk { display: block; font-size: 11px; line-height: 11px; letter-spacing: -0.22px; margin-top: 10px; color: #fff; }
  .dir-cue { position: absolute; left: 0; right: 0; bottom: 35px; bottom: calc(35px + 100lvh - 100dvh); text-align: center; color: #fff; font-weight: 700; font-size: 8px; line-height: 14px; letter-spacing: 0.16px; text-transform: uppercase; transition: opacity 0.3s ease; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .dir-cue svg { display: block; margin: 10px auto 0; overflow: visible; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
  .dir-about { position: absolute; left: 30px; right: 30px; top: 209px; color: #fff; opacity: 0; }
  .dir-about .lab { font-weight: 700; font-size: 11px; line-height: 12px; letter-spacing: 0.22px; text-transform: uppercase; margin-bottom: 19px; }
  .dir-about .aw { font-size: 11px; line-height: 20px; letter-spacing: -0.33px; text-transform: uppercase; margin-bottom: 40px; }
  .dir-about .aw .b { font-weight: 700; }
  .dir-about .aw .gap { height: 20px; }
  .dir-about .bio { font-size: 11px; line-height: 14px; letter-spacing: -0.33px; }
  .dir-work { position: relative; background: #fff; z-index: 2; }
  .dir-work .tabs { margin: 39px 0 40px; }
  .back { display: inline-block; font-size: 12px; line-height: 17px; letter-spacing: -0.26px; margin-top: 32px; }

  /* work (film) page */
  .film { position: relative; width: 100%; aspect-ratio: 16/9; background: #000 center/cover no-repeat; }
  .film iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Figma 551:977: Back 12px gray, brand 30/36 + project 28/28, 14px bold labels, 12/17 copy */
  .cs-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 13px; }
  .cs-head .brand { font-weight: 700; font-size: 30px; line-height: 36px; letter-spacing: -0.9px; }
  .cs-head .proj { font-size: 28px; line-height: 28px; letter-spacing: -0.6px; }
  .cs-led { margin-top: 80px; }
  .cs-led .lab { font-weight: 700; font-size: 14px; line-height: 17px; letter-spacing: -0.28px; margin-top: 42px; }
  .cs-led .lab:first-child { margin-top: 0; }
  .cs-led .cp { font-size: 12px; line-height: 17px; letter-spacing: -0.26px; color: #000; margin-top: 11px; }
  .cs-led .cp p { margin-bottom: 8px; }

  /* creatives ledger rows (desktop cre-row language) */
  .cre { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; padding: 20px 0 21px; }
  .cre .nm { font-weight: 700; font-size: 21px; line-height: 21px; letter-spacing: -0.63px; }
  .cre svg { flex-shrink: 0; transition: transform 0.3s ease; }
  .cre:active svg { transform: rotate(90deg); }

  /* experiential (Figma 553:1391-94 + 553:1472): hairline offering cards
     in a paged rail, then the desktop process list — the live step wears
     its number in black, the rest sit grey, one copy below */
  .x-card { flex: 0 0 318px; height: 286px; scroll-snap-align: start; background: #fff; color: #000; border: 1px solid #000; padding: 36px 36px 0; }
  .x-card h3 { font-weight: 700; font-size: 20px; line-height: 20px; letter-spacing: -0.6px; margin-bottom: 29px; }
  .x-card p { font-size: 13px; line-height: 19px; color: #000; max-width: 247px; }
  /* THE LOCK (desktop experiential.html): the block pins mid-screen and the
     scroll steps 01 -> 04; once Event Capture has had its turn the page
     releases and the footer comes in (Joel 9/8) */
  .hp-zone { position: relative; margin-top: 117px; }   /* Figma: bar 2244 -> heading 2361 */
  .hp-stick { position: sticky; top: 60px; background: #fff; padding-bottom: 40px; }
  .hp-row { display: flex; gap: 17px; align-items: baseline; margin-bottom: 13px; cursor: pointer; }
  .hp-row .n { display: none; font-size: 18px; line-height: 18px; color: #a3a3a3; width: 21px; flex: 0 0 21px; }
  .hp-row.on .n { display: block; }
  .hp-row .t { font-weight: 700; font-size: 19px; line-height: 19px; letter-spacing: -0.57px; color: #bdbdbd; transition: color 0.4s ease; }
  .hp-row.on .t { color: #000; }
  .hp-copy { font-size: 13px; line-height: 19px; color: #000; margin: 35px 0 0; min-height: 57px; transition: opacity 0.25s ease; }

  /* services — THE STEPPER (Figma 551:1164-1179 + Joel's note 607:347
     "Slide as you scroll from 1 2 3 etc"): the 01 Creative / Production /
     Post / Experiential row sticks under the header; as each pillar's
     items scroll up under it the number ticks and the words glide left so
     the live word seats at x58. Desktop's STEPS items verbatim. */
  /* THE PIN (Joel 9/8, "exact same as the main website"): the whole block
     pins under the header for STP_EXTRA px of scroll; scroll position picks
     the step, the words glide left in their clipper, the number ticks, the
     rule scrubs, and the step's columns pop up staggered (desktop paintCols). */
  .stp-zone { position: relative; margin: 73px -20px 0; }
  .stp-stick { position: sticky; top: 60px; height: calc(100vh - 60px); height: calc(100svh - 60px); overflow: hidden; background: #fff; padding: 0 20px; }
  .svc-rule { height: 2px; width: 350px; background: #000; transform-origin: left; transform: scaleX(0.18); margin-bottom: 17px; }
  .stp .row { display: flex; align-items: baseline; white-space: nowrap; }
  .stp .num { flex: 0 0 38px; font-size: 22px; line-height: 22px; }
  .stp .wclip { flex: 1; overflow: hidden; margin-right: -20px; }
  .stp .words { display: flex; gap: 30px; transition: transform 0.75s cubic-bezier(0.33,1,0.68,1); will-change: transform; }
  .stp .words span { font-weight: 700; font-size: 30px; line-height: 36px; letter-spacing: -0.9px; color: #bdbdbd; transition: color 0.55s ease; }
  .stp .words span.on { color: #000; }
  .stp-cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 29px; row-gap: 20px; align-content: start; padding: 44px 0 0 23px; will-change: transform; } /* no transition: the drift is scrubbed by the finger (a transition re-fired per scroll event made Post judder, Joel 9/8) */

/* ================= THE MORPH (header lettermark, h26, NO scale) =================
   Same choreography as logomorph.js, one size: q=0 full SIX26, q=1 compact SX.
   Beat 1 (q 0-0.4): I/2/6 fade in place. Beat 2 (q 0.4-1): the X glides
   left into the S; the (R) vanishes with the letters and returns after lock. */
const LM_H = 26, LM_K = LM_H / 107.9;
const LM = [
  { k:'s',  x: 0,     w: 140.8 },
  { k:'i',  x: 148.4, w: 39.6,  fade: true },
  { k:'x',  x: 184.8, w: 154.7, glide: true },
  { k:'n2', x: 334.1, w: 133.8, fade: true },
  { k:'n6', x: 474,   w: 140,   fade: true },
];
const svgInner = s => String(s).replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
const lmEl = document.getElementById('lm');
lmEl.innerHTML = LM.map(l => `<span data-k="${l.k}" style="left:${(l.x * LM_K).toFixed(1)}px;">${LSVG[l.k]}</span>`).join('') +
  /* the (R) is ONE svg (ring + R in the same viewBox). Two nested spans at a
     4.5px size got pixel-snapped independently by Safari and the R drifted
     off-centre inside the ring (Joel 9/8, "the R is still broken"). */
  `<span data-k="r" style="left:${(608.5 * LM_K).toFixed(1)}px; width:${(28.6 * LM_K).toFixed(1)}px; height:${(18.7 * LM_K).toFixed(1)}px;">
     <svg viewBox="0 0 29 19" style="width:100%;height:100%;display:block;overflow:visible;shape-rendering:geometricPrecision;">${svgInner(LSVG.rr)}<g transform="translate(7.4 4.56) scale(1 0.975)">${svgInner(LSVG.rm)}</g></svg>
   </span>`;
const lmSpans = {}; lmEl.querySelectorAll(':scope > span').forEach(sp => lmSpans[sp.dataset.k] = sp);
const citiesEl = document.getElementById('hdrCities');
const q5 = t => { t = Math.max(0, Math.min(1, t)); return t*t*t*(t*(t*6-15)+10); };
const X_BIG = 184.8 * LM_K, X_COMPACT = 140.8 * LM_K * 0.958;
let lmQ = -1;
function renderLM(q) {
  q = Math.max(0, Math.min(1, q));
  if (Math.abs(q - lmQ) < 0.004) return;
  lmQ = q;
  const ka = q5(q / 0.4);
  const kg = q5((q - 0.4) / 0.6);
  ['i', 'n2', 'n6'].forEach(k => { lmSpans[k].style.opacity = String(1 - ka); });
  lmSpans.x.style.transform = `translateX(${(-(X_BIG - X_COMPACT) * kg).toFixed(2)}px)`;
  /* cities ride the morph: beside SIX26 (186) at rest, beside SX (121) when compact */
  citiesEl.style.left = (186 - 65 * kg).toFixed(1) + 'px';
  const r = lmSpans.r;
  if (q >= 0.995) { r.style.transition = 'opacity 0.3s ease 0.1s'; r.style.opacity = '1';
    r.style.transform = `translateX(${(X_COMPACT + (154.7 * LM_K) + 3 - 608.5 * LM_K).toFixed(1)}px) translateY(-2px)`; }
  else { r.style.transition = 'none'; r.style.opacity = String(1 - ka); r.style.transform = 'none'; }
}
/* damped drive so fast scrolls glide, never snap (the desktop damper law) */
let lmTarget = 0, lmDisp = 0, lmAnim = false, lmLast = 0;
function lmTick(now) {
  const dt = Math.min(0.05, (now - lmLast) / 1000) || 1/60; lmLast = now;
  lmDisp += (lmTarget - lmDisp) * (1 - Math.exp(-10 * dt));
  if (Math.abs(lmTarget - lmDisp) < 0.004) { lmDisp = lmTarget; lmAnim = false; }
  renderLM(lmDisp);
  if (lmAnim) requestAnimationFrame(lmTick);
}
function lmDrive(target) {
  lmTarget = target;
  if (!lmAnim) { lmAnim = true; lmLast = performance.now(); requestAnimationFrame(lmTick); }
}
let lmScrollBound = false, lmMode = 'scroll';
function lmOnScroll() { if (lmMode === 'scroll') lmDrive(Math.min(1, window.scrollY / 120)); }
window.addEventListener('scroll', lmOnScroll, { passive: true });

let wpIdxLoaded = false, wpIdxLoading = false, searchTop = null;

    for (let i = 0; i < 6; i++) {
      const after = cursor ? ', after: ' + JSON.stringify(cursor) : '';
      const d = await gql('{ caseStudies(first: 100' + after + ') { pageInfo { hasNextPage endCursor } nodes { slug title } } }');

/* THE SX WIPE (desktop logomorph.js + index.html arrival, Joel 9/8): hitting
   the mark on an interior page draws the header's white all the way down,
   erasing chrome and page alike; home paints behind full white; the white
   then retracts UP to the header band while the SIX26 fades in from zero.
   On home itself the mark just returns you to the top. */
let sxLeaving = false;
lmEl.addEventListener('click', e => {
  e.preventDefault();
  const page = (location.hash || '#home').slice(1).split('/')[0] || 'home';
  if (page === 'home') { setMenu(false); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (sxLeaving) return;
  sxLeaving = true;
  setMenu(false);
  const sheet = document.createElement('div');
  sheet.style.cssText = 'position:fixed; left:0; right:0; top:0; height:0; background:#fff; z-index:60; pointer-events:none;';
  document.body.appendChild(sheet);
  const hdr = document.getElementById('hdr');
  let navved = false;
  const go = () => {
    if (navved) return;
    navved = true;
    hdr.style.transition = 'none'; hdr.style.opacity = '0'; hdr.style.zIndex = '70';   /* fade plays ON TOP of the retracting white */
    location.hash = '#home';                                                           /* home paints behind full white */
    sheet.style.transition = 'none'; sheet.style.height = window.innerHeight + 'px';
    void sheet.offsetHeight; void hdr.offsetHeight;                                    /* commit the start frame */
    sheet.style.transition = 'height 0.85s cubic-bezier(0.45, 0, 0.2, 1) 0.05s';
    sheet.style.height = HDR_H + 'px';                                                 /* ends ON the header band */
    hdr.style.transition = 'opacity 0.75s ease 0.15s'; hdr.style.opacity = '1';
    setTimeout(() => { sheet.remove(); hdr.style.transition = ''; hdr.style.opacity = ''; hdr.style.zIndex = ''; sxLeaving = false; }, 1500);
  };
  void sheet.offsetHeight;                                                             /* commit height 0 */
  sheet.style.transition = 'height 0.8s cubic-bezier(0.45, 0, 0.2, 1)';
  sheet.style.height = window.innerHeight + 'px';
  sheet.addEventListener('transitionend', () => setTimeout(go, 60), { once: true });
  setTimeout(go, 1400);   /* safety: never strand the tap */
});

/* THE LOOP LAW, mobile: the tile most in view plays its own loop */
let loopIO = null;
function armLoops() {
  if (loopIO) loopIO.disconnect();
  loopIO = new IntersectionObserver(es => es.forEach(e => {
    const tile = e.target;
    if (e.intersectionRatio >= 0.6) {
      let v = tile.querySelector('video');
      if (!v && tile.dataset.loop) {
        v = document.createElement('video');
        v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none';
        v.src = tile.dataset.loop;
        tile.querySelector('.ph').appendChild(v);
      }
      if (v) { v.play().then(() => tile.classList.add('playing')).catch(() => {}); }
    } else {
      const v = tile.querySelector('video');
      if (v && !v.paused) { v.pause(); tile.classList.remove('playing'); }
    }
  }), { threshold: [0, 0.6] });
  document.querySelectorAll('.tile[data-loop]').forEach(t => loopIO.observe(t));
}

/* THE STEPPER drive (desktop stepFromScroll / show / paintCols translated).
   The zone is stick + STP_EXTRA tall; while the stick is pinned, scroll
   progress p picks the step. Step change: words glide, number ticks, the
   old columns fade, the new step's columns pop up staggered. Inside a tall
   step (Post, Experiential) the columns drift up over the step's span so
   the last row is reachable on a small phone. Leaving the section re-arms. */
const STP_EXTRA = 1920;                  /* 4 steps x 480px of scroll */
let stpActive = -1, stpColsTimer = null;
function stpPaintCols(i) {
  const cols = document.getElementById('stpCols');
  cols.classList.remove('in');
  cols.innerHTML = SVC_STEPS[i].items.map((it, n) =>
    `<div class="it" style="--d:${(n * 0.09).toFixed(2)}s"><p class="t">${esc(it.t)}</p><p class="b">${esc(it.b)}</p></div>`).join('');
  cols.style.transform = '';
  /* how far this step's columns overrun the pinned stick, measured ONCE
     from layout (transforms and opacity do not move scrollHeight) */
  const stick = cols.closest('.stp-stick');
  stpOver = Math.max(0, cols.offsetTop + cols.scrollHeight - stick.clientHeight + 24);
  setTimeout(() => cols.classList.add('in'), 30);
}
let stpOver = 0;
function stpShow(i) {
  if (i === stpActive) return;
  stpActive = i;
  const words = [...document.querySelectorAll('#stpWords span')];
  words.forEach((w, n) => w.classList.toggle('on', n === i));
  document.getElementById('stpWords').style.transform = `translateX(${-words[i].offsetLeft}px)`;
  document.getElementById('stpNum').textContent = '0' + (i + 1);
  clearTimeout(stpColsTimer);
  document.getElementById('stpCols').classList.remove('in');
  stpColsTimer = setTimeout(() => stpPaintCols(i), 260);
}
function stpScroll() {
  const zone = document.getElementById('stpZone');
  if (!zone) return;
  const zr = zone.getBoundingClientRect();
  const start = window.scrollY + zr.top - HDR_H;          /* scrollY at which the stick pins */
  const p = (window.scrollY - start) / STP_EXTRA;
  const rule = document.getElementById('stpRule');
  rule.style.transform = 'scaleX(' + (0.18 + 0.82 * Math.max(0, Math.min(1, p))).toFixed(4) + ')';
  /* off the section entirely -> re-arm so it replays on return */
  if (zr.bottom < 0 || zr.top > window.innerHeight) {
    if (stpActive !== -1) { stpActive = -1; document.getElementById('stpCols').classList.remove('in'); }
    return;
  }
  const n = SVC_STEPS.length;
  const i = Math.max(0, Math.min(n - 1, Math.floor(Math.max(0, p) * n)));
  stpShow(i);
  /* tall step (Post, Experiential on a short phone): the columns drift up
     across the middle of the step's span so the last row is reachable */
  const cols = document.getElementById('stpCols');
  if (stpOver > 0 && p >= 0) {
    const ps = Math.max(0, Math.min(1, (p * n - i - 0.3) / 0.6));
    cols.style.transform = `translateY(${(-stpOver * ps).toFixed(1)}px)`;
  }
}
window.addEventListener('scroll', stpScroll, { passive: true });
function armStepper() {
  const zone = document.getElementById('stpZone');
  if (!zone) return;
  const stick = zone.querySelector('.stp-stick');
  zone.style.height = (stick.offsetHeight + STP_EXTRA) + 'px';
  stpActive = -1;
  stpScroll();
}

/* ================= News and Features: THE ROLL (desktop index.html) =================
   Periodic copies of the cards drift left at 24px/s; a tap lights a card
   (logo up, image burns in, the rest ghost) and pauses; tapping the lit
   card or READ opens the article; a swipe drags; the chevrons nudge one
   card. The WordPress press feed replaces the three baked cards when it
   answers (desktop law: 100% of what's on WordPress is on the site). */
const NEWS_PITCH = 305 + 61, WIPE_W = 274, WIPE_H = 154;
const news = { items: [], period: 0, drift: 0, vel: 0, paused: false, nudge: 0, last: 0, litTimer: null, run: false };
function newsCard(p) {
  const logo = p.logoHtml || `<img class="lg" style="height:${p.h}px" src="${esc(p.logo)}" alt="">`;
  const up = p.wipe ? -(WIPE_H + 24 - p.h) : 0;
  return `<div class="press" data-url="${esc(p.url)}">
    <div class="press-logo" style="--logo-up:${up}px;">${logo}</div>
    ${p.wipe ? `<div class="press-wipe" style="top:${p.h + 42 - WIPE_H}px;"><img src="${esc(p.wipe)}" alt="" loading="lazy"></div>` : ''}
    <p class="q">“${esc(p.q)}”</p>
    ${p.url ? `<a class="read" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">READ</a>` : ''}
  </div>`;
}
function buildNewsRail(items) {
  const host = document.getElementById('prTrack');
  if (!host) return;
  news.items = items;
  news.period = items.length * NEWS_PITCH;
  const copies = Math.ceil((innerWidth + NEWS_PITCH) / news.period) + 1;
  let html = '';
  for (let c = 0; c < copies; c++) html += items.map(newsCard).join('');
  host.innerHTML = html;
  const thumb = document.querySelector('#prBar i');
  if (thumb) thumb.style.width = (303 / items.length).toFixed(1) + 'px';
}
function newsUnlight() {
  const host = document.getElementById('prTrack');
  if (!host) return;
  host.classList.remove('lit');
  host.querySelectorAll('.press.lit').forEach(c => c.classList.remove('lit'));
  news.paused = false;
}
function newsTick(now) {
  if (!news.run) return;
  const host = document.getElementById('prTrack');
  if (!host) { news.run = false; return; }
  const dt = Math.min(0.05, (now - news.last) / 1000) || 0;
  news.last = now;
  if (!news.paused) news.drift += 24 * dt;
  /* momentum: the flick's speed decays (~0.45s time constant) back onto the slow roll */
  if (news.vel) { news.drift += news.vel * dt; news.vel *= Math.exp(-dt * 2.2); if (Math.abs(news.vel) < 2) news.vel = 0; }
  if (news.nudge !== 0) { const step = Math.sign(news.nudge) * Math.min(Math.abs(news.nudge), 700 * dt); news.drift += step; news.nudge -= step; }
  const pos = ((news.drift % news.period) + news.period) % news.period;
  host.style.transform = 'translateX(' + (-pos).toFixed(2) + 'px)';
  const thumb = document.querySelector('#prBar i');
  if (thumb) thumb.style.transform = 'translateX(' + ((pos / news.period) * (303 - 303 / news.items.length)).toFixed(1) + 'px)';
  requestAnimationFrame(newsTick);
}
function armNews() {
  buildNewsRail(PRESS_M);
  const host = document.getElementById('prTrack');
  news.drift = 0; news.nudge = 0; news.paused = false; news.last = performance.now();
  if (!news.run) { news.run = true; requestAnimationFrame(newsTick); }
  /* tap: light it (desktop hover); tap again or READ: open */
  host.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const c = e.target.closest('.press');
    if (!c) return;
    if (c.classList.contains('lit')) { if (c.dataset.url) window.open(c.dataset.url, '_blank', 'noopener'); return; }
    host.querySelectorAll('.press.lit').forEach(o => o.classList.remove('lit'));
    c.classList.add('lit'); host.classList.add('lit'); news.paused = true;
  });
  /* tap anywhere else: the card goes back to normal and the roll resumes (Joel 9/8) */
  if (!news.docBound) {
    news.docBound = true;
    document.addEventListener('click', e => {
      const lit = document.querySelector('#prTrack .press.lit');
      if (lit && !e.target.closest('#prTrack .press')) newsUnlight();
    });
  }
  /* swipe drags the rail (the cards follow the finger), a hold parks it, the roll resumes on release */
  armDrag(host.parentElement, {
    start: () => { news.paused = true; news.vel = 0; },
    move: dx => { news.drift -= dx; },
    end: (dragged, v) => { if (dragged) news.vel = v; if (!host.querySelector('.press.lit')) news.paused = false; }
  });
  document.getElementById('prPrev').onclick = () => { news.nudge -= NEWS_PITCH; };
  document.getElementById('prNext').onclick = () => { news.nudge += NEWS_PITCH; };
  /* WordPress press feed (same query as the desktop) */
  fetch('https://api.sixtwentysix.co/graphql', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: '{ posts(first: 100) { nodes { title news { linkUrl logo { node { sourceUrl mediaDetails { width height } } } logoImage { node { sourceUrl mediaDetails { width height } } } } featuredImage { node { sourceUrl } } } } }' })
  }).then(r => r.json()).then(j => {
    const items = ((j.data && j.data.posts && j.data.posts.nodes) || []).map(n => {
      const nw = n.news || {};
      const lg = (nw.logo && nw.logo.node) || (nw.logoImage && nw.logoImage.node) || null;
      const d = lg && lg.mediaDetails;
      const w = d && d.width && d.height ? Math.min(170, Math.round(d.width / d.height * 34)) : null;
      return { q: n.title, url: nw.linkUrl || '', h: 34,
        wipe: (n.featuredImage && n.featuredImage.node && n.featuredImage.node.sourceUrl) || '',
        logoHtml: lg ? `<img src="${esc(lg.sourceUrl)}" alt="" style="height:34px; width:${w ? w + 'px' : 'auto'}; max-width:170px; filter:brightness(0);">` : '' };
    }).filter(p => p.q);
    if (items.length >= 3 && document.getElementById('prTrack')) buildNewsRail(items);
  }).catch(() => {});
}

/* finger drag for the rolling rails (news, team): touch + pointer, passive */
function armDrag(el, h) {
  /* velocity from the last ~80ms of movement -> the rail keeps the flick's
     speed on release and eases back to its slow roll (Joel 9/8) */
  let x = null, dragged = false, samples = [];
  const down = cx => { x = cx; dragged = false; samples = [[performance.now(), cx]]; h.start(); };
  const move = cx => {
    if (x === null) return;
    const dx = cx - x; x = cx;
    const now = performance.now(); samples.push([now, cx]); samples = samples.filter(s => now - s[0] < 90);
    if (dx) { dragged = true; h.move(dx); }
  };
  const up = () => {
    if (x === null) return;
    x = null;
    let v = 0;
    if (samples.length > 1) { const a = samples[0], b = samples[samples.length - 1]; const dt = (b[0] - a[0]) / 1000; if (dt > 0) v = -(b[1] - a[1]) / dt; }
    h.end(dragged, Math.max(-3500, Math.min(3500, v)));
  };
  el.addEventListener('touchstart', e => down(e.touches[0].clientX), { passive: true });
  el.addEventListener('touchmove', e => move(e.touches[0].clientX), { passive: true });
  el.addEventListener('touchend', up, { passive: true });
  el.addEventListener('touchcancel', up, { passive: true });
}

/* paged rails: the thumb is 1/n of the 303px track and walks with the page */
function armRails() {
  document.querySelectorAll('[data-rail]').forEach(rail => {
    const bar = document.getElementById(rail.dataset.rail);
    if (!bar) return;
    const cards = rail.children.length || 1;
    const thumb = bar.firstElementChild;
    thumb.style.width = (303 / cards).toFixed(1) + 'px';
    const paint = () => {
      const step = rail.children[1] ? rail.children[1].offsetLeft - rail.children[0].offsetLeft : rail.clientWidth;
      const i = Math.max(0, Math.min(cards - 1, Math.round(rail.scrollLeft / step)));
      thumb.style.transform = `translateX(${(i * 303 / cards).toFixed(1)}px)`;
    };
    rail.addEventListener('scroll', paint, { passive: true });
    rail.addEventListener('scrollend', paint, { passive: true });
    paint();
  });
}

  const words = document.querySelectorAll('#abGray .w');
  const p1 = Math.max(0, Math.min(1, (y - (sz.offsetTop - HDR_H)) / AB_LIT));
  const lit = Math.floor(p1 * words.length + 0.0001);
  words.forEach((w, i) => w.classList.toggle('lit', i < lit));
  /* 2. the reel: fades + rises in as it comes on screen (one clocked play),
        then the scroll grows it 0.7 -> 1 across AB_GROW while pinned, holds
        AB_LOCK, releases; the header goes dark while the reel is full screen */
  const rz = document.getElementById('abReelZone'), reel = document.getElementById('abReel');
  const rr = rz.getBoundingClientRect();
  if (rr.top < vh * 0.85 && !reel.classList.contains('in')) reel.classList.add('in');
  const p2 = (y - rz.offsetTop) / AB_GROW;
  if (p2 > 0) {
    const k = Math.min(1, p2); const s = k * k * (3 - 2 * k);
    reel.classList.add('scrub');
    reel.style.transform = `translateY(0) scale(${(0.7 + 0.3 * s).toFixed(4)})`;
  } else if (reel.classList.contains('scrub')) { reel.classList.remove('scrub'); reel.style.transform = ''; }
  const full = p2 >= 0.9 && rr.bottom > vh;        /* pinned full-screen: dark chrome */
  document.getElementById('hdr').classList.toggle('dark', full);
  /* 3. the values step with the scroll while their block is pinned */
  const cz = document.getElementById('cvZone'), cs = document.getElementById('cvStick');
  const pinStart = cz.offsetTop - (parseFloat(cs.style.top) || 60);
  if (y >= pinStart) cvSet(Math.min(CV_VALUES.length - 1, Math.floor(((y - pinStart) / CV_SPAN) * CV_VALUES.length)));
  else cvSet(0);
}
window.addEventListener('scroll', aboutScroll, { passive: true });
const TM_PITCH = 236, TM_H = 330, TM_K = 0.365;
function tmCell(t, i, lap) {
  const w = Math.round(t.w * TM_K), h = Math.round(t.h * TM_K);
  /* Joel 9/8: same scale, but the photo sits right under the labels (top 48)
     so more of the body shows; the rail's edge + the dissolve cut it off below */
  return `<div class="tm-cell" style="left:${(20 + i * TM_PITCH + lap)}px;">
    ${t.img ? `<img src="${esc(t.img)}" alt="${esc(t.name)}" style="left:40px; top:48px; width:${w}px; height:${h}px;">` : ''}
    <div class="tm-rule" style="left:8px; top:6px;"></div>
    <p class="tm-name" style="left:20px; top:4px;">${esc(t.name)}</p>
    <p class="tm-role" style="left:20px; top:20px;">${esc(t.role)}</p>
  </div>`;
}
function tmTick(now) {
  if (!tmRun) return;
  const track = document.getElementById('tmTrack');
  if (!track) { tmRun = false; return; }
  const dt = Math.min(0.05, (now - tmLast) / 1000) || 0; tmLast = now;
  const period = TM_PITCH * TEAM.length;
  if (!tmPaused) tmDrift += 16 * dt;                      /* desktop 44px/s at 0.365 scale */
  if (tmVel) { tmDrift += tmVel * dt; tmVel *= Math.exp(-dt * 2.2); if (Math.abs(tmVel) < 2) tmVel = 0; }   /* flick momentum */
  const pos = (((tmPos * TM_PITCH + tmDrift) % period) + period) % period;
  track.style.transform = `translateX(${(-pos).toFixed(2)}px)`;
  requestAnimationFrame(tmTick);
}
function armAbout() {
  const sz = document.getElementById('abStmtZone');
  if (!sz) return;
  const stick = sz.firstElementChild;
  sz.style.height = (stick.offsetHeight + AB_LIT) + 'px';
  const rz = document.getElementById('abReelZone');
  rz.style.height = (window.innerHeight + AB_GROW + AB_LOCK) + 'px';
  const cs = document.getElementById('cvStick'), cz = document.getElementById('cvZone');
  cs.style.top = Math.max(60, Math.round((window.innerHeight - cs.offsetHeight) / 2)) + 'px';
  cz.style.height = (cs.offsetHeight + CV_SPAN) + 'px';
  cvOn = -1;
  cs.querySelectorAll('.v').forEach(v => v.addEventListener('click', () => cvSet(Number(v.dataset.i))));
  /* team: two laps so the roll never shows a gap; chevrons page a cell */
  const period = TM_PITCH * TEAM.length;
  document.getElementById('tmTrack').innerHTML = TEAM.map((t, i) => tmCell(t, i, 0)).join('') + TEAM.map((t, i) => tmCell(t, i, period)).join('');
  tmDrift = 0; tmPos = 0; tmPaused = false; tmLast = performance.now();
  if (!tmRun) { tmRun = true; requestAnimationFrame(tmTick); }
  /* swipe drags the cells with the finger, a hold parks the roll, release resumes */
  armDrag(document.getElementById('tmRail'), {
    start: () => { tmPaused = true; tmVel = 0; },
    move: dx => { tmDrift -= dx; },
    end: (dragged, v) => { if (dragged) tmVel = v; tmPaused = false; }
  });
  document.getElementById('tmNext').onclick = () => { tmPos = Math.min(TEAM.length - 2, tmPos + 1); };
  document.getElementById('tmPrev').onclick = () => { tmPos = Math.max(-2, tmPos - 1); };
  aboutScroll();
}

async function bootWork(slug) {
  /* instant landing: the tapped tile's art paints the film box NOW */
  try {
    const art = JSON.parse(sessionStorage.getItem('sx-m-art') || '{}');
    if (art.src && Date.now() - (art.t || 0) < 15000)
      document.getElementById('film').style.backgroundImage = `url("${art.src.replace(/"/g, '%22')}")`;
  } catch (e) {}
  try {
    const r = await fetch('https://api.sixtwentysix.co/graphql', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: '{ caseStudy(id: ' + JSON.stringify(slug) + ', idType: SLUG) { title pageMeta { headline featuredvimeoid intro { introBlocks { title body } theChallenge theSpark theDelivery results awards } } featuredImage { node { sourceUrl } } } }' })
    });
    const cs = (await r.json()).data.caseStudy;
    if (!cs) return;
    const tt = splitT(cs.title || '');
    document.getElementById('csTitle').innerHTML =
      `<span class="brand">${esc((cs.title || '').split(/\s+[–—-]\s+/)[0])}</span>${tt.proj ? `<span class="proj">${esc(tt.proj)}</span>` : ''}`;
    const meta = cs.pageMeta || {}, intro = meta.intro || {};
    if (meta.featuredvimeoid)
      document.getElementById('filmSlot').innerHTML =
        `<iframe src="https://player.vimeo.com/video/${esc(meta.featuredvimeoid)}?title=0&byline=0&portrait=0&dnt=1&autoplay=1&muted=1&playsinline=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    else if (cs.featuredImage && cs.featuredImage.node)
      document.getElementById('film').style.backgroundImage = `url("${cs.featuredImage.node.sourceUrl}")`;
    const blocks = (intro.introBlocks || []).filter(b => b && String(b.body || '').trim());
    let rows = blocks.length
      ? blocks.map(b => [b.title || '', b.body, true])
      : [['Big Idea', meta.headline, false], ['Challenge', intro.theChallenge, false],
         ['The Spark', intro.theSpark, false], ['The Delivery', intro.theDelivery, false],
         ['Results', intro.results, false], ['Awards', intro.awards, true]];
    rows = rows.filter(x => x[1] && String(x[1]).trim());
    /* no copy -> film straight to the footer (the desktop law) */
    document.getElementById('csLed').innerHTML = rows.map(([l, c, isHtml]) =>
      `<p class="lab">${esc(l)}</p><div class="cp">${isHtml ? c : '<p>' + esc(c) + '</p>'}</div>`).join('');
  } catch (e) {}
}

function bootCaseStudies() {
  document.querySelectorAll('#csTabs button').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('#csTabs button').forEach(o => o.classList.toggle('on', o === t));
    document.getElementById('csGrid').innerHTML = gridOpen() + csTiles(t.dataset.c) + '</div>';
    armAll();
  }));
}

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); }
}), { threshold: 0.1 });
function revealNow() {
  document.querySelectorAll('.fdm:not(.seen)').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < innerHeight + 80 && r.bottom > -80) el.classList.add('seen');
  });
}
window.addEventListener('scroll', revealNow, { passive: true });
function armAll() {
  document.querySelectorAll('.fdm:not(.seen)').forEach(el => io.observe(el));
  revealNow();
  armToggles();
  armLoops();
}

/* THE REEL MOMENT, mobile (desktop updateReelMoment translated). The white
   dissolve starts at 80% of the morph span (120px) and rides a smoothstep
   over the next 160px; the header goes dark past 55%. When the statement
   sheet's top edge (t, viewport px) enters the 60px band, a white clone of
   the header is clipped to BELOW the edge and the dark header to ABOVE it,
   so the white stripes back in bottom-up exactly on the sheet's edge. */
const HOME_FADE_START = 96, HOME_FADE_LEN = 160, HDR_H = 60;
let homeWipe = null;
function clearHomeWipe() {
  const hdr = document.getElementById('hdr');
  hdr.style.clipPath = '';
  if (homeWipe) { homeWipe.remove(); homeWipe = null; }
}
function homeScroll() {
  const sheet = document.getElementById('homeSheet');
  const hdr = document.getElementById('hdr'), bg = document.getElementById('hdrBg');
  if (!sheet) return;
  const t = sheet.getBoundingClientRect().top;
  const ft = Math.max(0, Math.min(1, (window.scrollY - HOME_FADE_START) / HOME_FADE_LEN));
  const fade = ft * ft * (3 - 2 * ft);
  bg.style.opacity = t > 0 ? String(+(1 - fade).toFixed(3)) : '';
  /* the reel zooms out 1.4 -> 1.0 on the same breath as the white dissolve (desktop: 1.35) */
  const reel = document.getElementById('homeReel');
  if (reel) reel.style.transform = 'scale(' + (1.4 - 0.4 * fade).toFixed(4) + ')';
  const dark = fade > 0.55 && t > 0;
  const wiping = dark && t < HDR_H;
  if (hdr.classList.contains('dark') !== dark) {
    if (t < HDR_H) { hdr.classList.add('snap'); setTimeout(() => hdr.classList.remove('snap'), 80); }
    hdr.classList.toggle('dark', dark);
  }
  if (wiping) {
    if (!homeWipe) {
      const w = hdr.cloneNode(true);        /* keeps the ids so the #hdr CSS applies; appended
                                               AFTER the real one so getElementById still hits it */
      w.classList.remove('dark', 'snap');
      w.style.pointerEvents = 'none';
      w.querySelector('#hdrBg').style.opacity = '1';
      document.body.appendChild(w);
      homeWipe = w;
    }
    hdr.style.clipPath = 'inset(0 0 ' + Math.max(0, HDR_H - t).toFixed(1) + 'px 0)';
    homeWipe.style.clipPath = 'inset(' + Math.max(0, t).toFixed(1) + 'px 0 0 0)';
  } else clearHomeWipe();
}

function routeChrome() {
  const page = (location.hash || '#home').slice(1).split('/')[0] || 'home';
  const hdr = document.getElementById('hdr');
  /* interior pages live at the compact SX; home rides the scroll morph */
  if (page === 'home') { lmMode = 'scroll'; lmOnScroll(); homeScroll(); }
  else {
    lmMode = 'page'; lmDrive(1);
    clearHomeWipe();
    document.getElementById('hdrBg').style.opacity = '';
    hdr.classList.toggle('dark', page === 'director' && window.scrollY < innerHeight * 1.6);
  }
}
window.addEventListener('scroll', () => {
  const page = (location.hash || '#home').slice(1).split('/')[0] || 'home';
  if (page === 'director')
    document.getElementById('hdr').classList.toggle('dark', window.scrollY < innerHeight * 1.6);
  else if (page === 'home') homeScroll();
}, { passive: true });

function route() {
  setMenu(false);
  const h = (location.hash || '#home').slice(1);
  const [page, arg] = h.split('/');
  if (page === 'director') app.innerHTML = R.director(decodeURIComponent(arg || ''));
  else if (page === 'work') { app.innerHTML = R.work(arg); bootWork(decodeURIComponent(arg || '')); }
  else app.innerHTML = (R[page] || R.home)();
  window.scrollTo(0, 0);
  routeChrome();
  if (page === 'director') {
    document.querySelectorAll('.tabs button').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(o => o.classList.toggle('on', o === t));
      paintDirGrid(window.__dirWorks, t.dataset.c);
    }));
    const first = document.querySelector('.tabs button');
    if (first) paintDirGrid(window.__dirWorks, first.dataset.c);
    dirScroll();
  }
  if (page === 'case-studies') bootCaseStudies();
  if (page === 'services') armStepper();
  if (page === 'about') armAbout(); else tmRun = false;
  if (page === 'experiential') armHP();
  if (page === 'home' || page === '') armNews(); else news.run = false;
  armRails();
  armAll();
}
window.addEventListener('hashchange', route);
route();
