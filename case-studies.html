const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const b = e.boundingClientRect;
    /* zero-size wrappers (absolute children only) never reach ratio 0.15 —
       they were permanently invisible (the empty-content bug, 8/19) */
    if (e.intersectionRatio >= 0.15 || (e.isIntersecting && (b.width < 2 || b.height < 2))) {
      /* one-shot (8/21): un-revealing on exit made the reveal REPLAY when
         scrolling back up — tabs/toggles popped in 28px low on staggered
         delays, overlapping, then jumped to their seats. Seen stays seen. */
      e.target.classList.add('seen');
      io.unobserve(e.target);
    }
  });
}, { threshold: [0, 0.15] });

    'exp-treehut.jpg': 'https://player.vimeo.com/progressive_redirect/playback/1065679819/rendition/1080p/file.mp4?loc=external&log_user=0&signature=ed0d1ef6833b7f451e3657029cad1c76ce15edd414401b658b7c54a770748a84',
    'exp-googleplay.jpg': 'https://player.vimeo.com/progressive_redirect/playback/1065964832/rendition/1080p/file.mp4?loc=external&log_user=0&signature=9a48cdd6ae7aa0b0d84ea1be8c73b7bf458df2582d6cded7cdfb722ff8027284&user_id=26828343',
    'exp-nike.jpg': 'https://player.vimeo.com/progressive_redirect/playback/1065679815/rendition/1080p/file.mp4?loc=external&log_user=0&signature=7c17e3990ef977b829fc6787800b0bcfe860254d5caa5f65d3eb12cf35058468&user_id=26828343',
    'exp-republic.jpg': 'https://player.vimeo.com/progressive_redirect/playback/1065679804/rendition/1080p/file.mp4?loc=external&log_user=0&signature=b4e9f026c42f5752c8526546d5d999b7729d21a759bb9f2806fc2d7ac27cf7ea&user_id=26828343',
    'exp-ebay.jpg': 'https://player.vimeo.com/progressive_redirect/playback/1066025459/rendition/1080p/file.mp4?loc=external&log_user=0&signature=2ea280206dc4ed4e91faa5ac68d117c5f78072b36a726dc4ec7b8b0ef4e0ec8c&user_id=26828343',
    'exp-aperol.jpg': 'https://player.vimeo.com/progressive_redirect/playback/967113990/rendition/1080p/file.mp4?loc=external&log_user=0&signature=4d45d5c51e1171c42cd5788ee773bc5ba83e250cac5e512214fd19727a4bcdb1',
  };
  WORKS.forEach(w => { w.loop = LOOPS[w.img.split('/').pop()] || null; });

  /* Frame geometry: 3-up columns at exact xs; other densities computed. */
  const LEFT = 62, CONTENT_W = 1584;
  const X3 = [62, 649, 1214], W3 = 431;
  const GRID_TOP = 441, LABEL_GAP = 45, ROW_PITCH_EXTRA = 181; // 242+181 = 423 pitch at 3-up
  const RADIUS = { 4: 5.137, 3: 7.593, 2: 13.051 };

  const host = document.getElementById('csgrid');
  const under = document.getElementById('cs-under');
  const tabs = [...document.querySelectorAll('.cs-tab')];
  /* Opens on Live Action (Joel 9/11) — the lead tab of the rail. */
  let cat = 'live', cols = 2;
  /* THE ROW-COUNT LAW (Joel 9/11, supersedes the per-category auto of 8/25):
     ONE density for the whole page. Every tab reads rows of 2; the cluster
     switches all three tabs together, so the grid never re-rhythms when you
     move between filters. */

  let tiles = [];

  function layout() {
    const list = WORKS.filter(w => w.cats.includes(cat));
    host.innerHTML = '';
    tiles = [];
    const w = cols === 3 ? W3 : (CONTENT_W - (cols - 1) * 145.5) / cols;
    const h = Math.round(w * 242 / 431);
    const pitch = h + ROW_PITCH_EXTRA;
    const rows = Math.ceil(list.length / cols);
    /* THE SHORT-ROW LAW (Joel 8/22): when the last row can't fill its
       columns, its tiles center as a group on the content rail. */
    const lastRowStart = Math.floor((list.length - 1) / cols) * cols;
    const inLast = list.length - lastRowStart;
    list.forEach((wk, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      let x = cols === 3 ? X3[col] : LEFT + col * (w + 145.5);
      if (i >= lastRowStart && inLast < cols) {
        const gap = 145.5;
        const groupW = inLast * w + (inLast - 1) * gap;
        x = LEFT + (CONTENT_W - groupW) / 2 + (i - lastRowStart) * (w + gap);
      }
      const y = GRID_TOP + row * pitch;
      const a = document.createElement('a');
      a.className = 'work-thumb fd seen';
      const csFile = wk.img.split('/').pop();
      a.href = 'case-study.html' + (SLUGS[csFile] ? '?work=' + SLUGS[csFile] : '');
      a.style.cssText = `left:${x}px; top:${y}px; width:${w}px; height:${h}px; border-radius:0;`;
      a.innerHTML = `<img src="${wk.img}" alt="${wk.t}">`;
      if (wk.loop) a.dataset.loop = wk.loop; // the engine builds the <video>
      const cap = document.createElement('p');
      cap.className = 'wtitle fd seen';
      cap.textContent = wk.t;
      cap.style.cssText = `left:${x}px; top:${y + h + LABEL_GAP}px;`;
      host.append(a, cap);
      tiles.push({ a, cap, x, y, w, h, row, rows });
    });
    const end = GRID_TOP + rows * pitch;
    document.getElementById('footer').style.top = Math.max(1285, end) + 'px';
    document.getElementById('page').style.height = (Math.max(1285, end) + 349) + 'px';

    /* THE site hover law — one engine (gridhover.js) for every grid.
       Re-attached after each relayout since the tiles are rebuilt. */
    SXGrid.attach({
      tiles: tiles.map(t => ({ el: t.a, caps: [{ el: t.cap, gap: LABEL_GAP }] })),
      ghost: { el: document.body, cls: 'ghost' },
      bounds: { left: LEFT, right: LEFT + CONTENT_W },
    });
  }

  /* Tab rail: seats are MEASURED and right-aligned to the content rail so
     reordering the labels keeps the frame's 29px gaps and its flush right
     edge, whatever each label happens to measure. */
  const TAB_GAP = 29, RAIL_R = LEFT + CONTENT_W;
  function seatTabs(quiet) {
    const t0 = under.style.transition;
    if (quiet) under.style.transition = 'none';
    let x = RAIL_R;
    tabs.slice().reverse().forEach(t => {
      x -= t.getBoundingClientRect().width;
      t.style.left = x + 'px';
      x -= TAB_GAP;
    });
    const on = document.querySelector('.cs-tab.on') || tabs[0];
    under.style.left = on.offsetLeft + 'px';
    under.style.width = on.getBoundingClientRect().width + 'px';
    if (quiet) { void under.offsetWidth; under.style.transition = t0; }
  }

  tabs.forEach(t => t.addEventListener('click', () => {
    if (t.dataset.cat === cat) return;
    cat = t.dataset.cat;
    tabs.forEach(o => o.classList.toggle('on', o === t));
    under.style.left = t.offsetLeft + 'px';
    under.style.width = t.getBoundingClientRect().width + 'px';
    layout();
  }));

  document.querySelectorAll('.tbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cols = parseInt(btn.dataset.cols, 10);
      layout();
    });
  });

  seatTabs(true);
  window.addEventListener('load', () => seatTabs(true));
  layout();
})();

document.querySelectorAll('.fd').forEach(el => io.observe(el));
</script>
<script>
/* Back-to-the-exact-spot law (Joel 8/24): runs HERE — after the grids
   above have built (the page is at full height, so the seat can't clamp)
   and BEFORE smoothscroll.js boots (its internal target reads the
   restored position). */
(function () {
  try {
    var raw = sessionStorage.getItem('sx-return-go');
    if (!raw) return;
    sessionStorage.removeItem('sx-return-go');
    var d = JSON.parse(raw);
    /* 9/3: stored page may carry a query (?who=<director>) — match path
       and query separately so per-director returns restore their seat */
    var curPath = location.pathname.split('/').pop() || 'index.html';
    var sp2 = new URLSearchParams(location.search); sp2.delete('r');
    var curQ = sp2.toString();
    var stored = String(d.page || '').split('?');
    if (stored[0] !== curPath) return;
    if (stored[1] && stored[1] !== curQ) return;
    /* the page reaches full height only after load (footer law stretch),
       so the seat restores THEN; smoothscroll adopts any external scroll
       while idle, so this slots straight into its engine */
    var seat = function () { window.scrollTo(0, d.y || 0); };
    window.addEventListener('load', function () {
      seat();
      setTimeout(seat, 120); /* once more after late layout settles */
    });
  } catch (e) {}
})();
</script>
